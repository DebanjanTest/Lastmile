[package]
name = "lastmile-guard"
version = "2.2.0"
description = "LastMile Guard - 5.0\" Automotive Multi-App Delivery HUD"
authors = ["LastMile Engineering Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Physical GPIO support for Raspberry Pi OS
# rppal can be conditionally enabled on ARM/Linux hardware

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
