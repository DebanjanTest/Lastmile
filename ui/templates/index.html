<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastMile Guard - 5.0" Multi-App Delivery HUD (React 18 Engine)</title>
    <!-- Leaflet CSS for high-contrast vector road & traffic maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/static/css/tripper.css">
    
    {% if google_maps_api_key %}
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=geometry"></script>
    {% endif %}
    <!-- Leaflet Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for Seamless JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="workbench-theme">
    <div class="workbench-layout">
        <!-- 5-INCH HARDWARE DEVICE CHASSIS (800x480 ACTIVE DISPLAY) -->
        <div class="device-chassis">
            <div class="chassis-top-bar">
                <div class="chassis-lens-dot" title="Front Dashcam Lens"></div>
                <div class="chassis-title">LASTMILE GUARD • 5.0" MULTI-APP DELIVERY HUD (800×480)</div>
                <div class="chassis-leds">
                    <span class="status-led led-green" title="System Live"></span>
                    <span class="status-led led-blue" title="GPS Locked"></span>
                    <span class="status-led led-orange" title="RAM-Disk Buffer OK"></span>
                </div>
            </div>

            <!-- EXACT 800x480 ACTIVE SCREEN VIEWPORT (REACT MOUNT ROOT) -->
            <div class="screen-viewport" id="screenViewport">
                <!-- FULLSCREEN ROAD & TRAFFIC MAP CANVAS -->
                <div id="mapView" class="map-view"></div>
                
                <!-- REACT APP MOUNT CONTAINER -->
                <div id="reactHudRoot"></div>
            </div>
        </div>

        <!-- ==============================================================================
             REAL-TIME TEST BENCH CONTROLS (UNDERNEATH 5-INCH DISPLAY)
             ============================================================================== -->
        <div class="bench-control-panel">
            <div class="panel-header">
                <span class="panel-tag">⚡ REACT 18 MULTI-APP DISPATCH TEST RIG</span>
                <span class="panel-hint">Select any order to mark the blue route to the restaurant, then to the drop-off location:</span>
            </div>
            <div class="bench-buttons-row">
                <button class="bench-btn btn-refresh" id="btnBenchRefresh" onclick="window.hudDispatcher && window.hudDispatcher.refreshOrders()">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">1. Refresh Orders <kbd>[O]</kbd></span>
                </button>
                <button class="bench-btn btn-accept" id="btnBenchAccept" onclick="window.hudDispatcher && window.hudDispatcher.acceptTopOrder()">
                    <span class="btn-icon">✅</span>
                    <span class="btn-text">2. Opt In / Accept <kbd>[A]</kbd></span>
                </button>
                <button class="bench-btn btn-store" id="btnBenchStore" onclick="window.hudDispatcher && window.hudDispatcher.reachStore()">
                    <span class="btn-icon">🏪</span>
                    <span class="btn-text">3. Reached Store <kbd>[R]</kbd></span>
                </button>
                <button class="bench-btn btn-pickup" id="btnBenchPickup" onclick="window.hudDispatcher && window.hudDispatcher.confirmPickup()">
                    <span class="btn-icon">🍴</span>
                    <span class="btn-text">4. Picked Up (To Cust) <kbd>[K]</kbd></span>
                </button>
                <button class="bench-btn btn-deliver" id="btnBenchDeliver" onclick="window.hudDispatcher && window.hudDispatcher.completeDelivery()">
                    <span class="btn-icon">📦</span>
                    <span class="btn-text">5. Complete Delivery <kbd>[U]</kbd></span>
                </button>
                <button class="bench-btn btn-sos" onclick="window.hudDispatcher && window.hudDispatcher.triggerSos()">
                    <span class="btn-icon">🚨</span>
                    <span class="btn-text">Manual SOS <kbd>[S]</kbd></span>
                </button>
                <button class="bench-btn btn-crash" onclick="window.hudDispatcher && window.hudDispatcher.triggerTilt()">
                    <span class="btn-icon">💥</span>
                    <span class="btn-text">Tilt Crash <kbd>[T]</kbd></span>
                </button>
                <button class="bench-btn btn-cam" onclick="window.hudDispatcher && window.hudDispatcher.toggleDashcam()">
                    <span class="btn-icon">📷</span>
                    <span class="btn-text">Dashcam <kbd>[D]</kbd></span>
                </button>
            </div>
        </div>
    </div>

    <!-- REACT 18 APPLICATION SCRIPT (BABEL COMPILED) -->
    <script type="text/babel" src="/static/js/tripper.js"></script>
</body>
</html>
